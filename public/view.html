<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View a shared screen in real-time via ScreenCast.">
  <title>InstaScreen — Viewing Live Screen</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-animation">
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
  </div>

  <div class="viewer-container">

    <!-- ═══ Connecting State ═══ -->
    <div id="connecting" class="viewer-state">
      <div class="spinner"></div>
      <h2>Connecting...</h2>
      <p id="status-text">Joining the screen sharing session</p>
    </div>

    <!-- ═══ Stream Ended State ═══ -->
    <div id="ended" class="viewer-state hidden">
      <div class="ended-icon">📺</div>
      <h2>Stream Ended</h2>
      <p>The presenter has stopped sharing their screen.</p>
      <br>
      <a href="/" class="btn btn-ghost btn-sm">Share Your Own Screen →</a>
    </div>

    <!-- ═══ Stream View ═══ -->
    <div id="stream-container" class="stream-container hidden">
      <video id="viewer-video" class="viewer-video" autoplay playsinline muted></video>

      <!-- Unmute banner (shown when stream starts muted) -->
      <div id="unmute-banner" class="unmute-banner hidden">
        <button id="unmute-btn" class="btn btn-primary btn-sm">
          🔊 Click to Enable Sound
        </button>
      </div>

      <!-- Controls overlay (appears on hover) -->
      <div class="viewer-controls">
        <div class="viewer-live-badge">
          <div class="live-dot"></div>
          LIVE
        </div>
        <div class="viewer-controls-right">
          <button id="chat-control-btn" class="btn btn-ghost btn-icon" title="Toggle Live Chat">
            💬
          </button>
          <button id="mute-toggle-btn" class="btn btn-ghost btn-icon" title="Toggle audio">
            🔇
          </button>
          <button id="fullscreen-btn" class="btn btn-ghost btn-icon" title="Toggle fullscreen">
            ⛶
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Floating Chat Toggle Button (for mobile / outside video overlay) -->
  <button id="chat-toggle-btn" class="chat-toggle-btn hidden" title="Open Live Chat">
    <span>💬 Chat</span>
    <span id="chat-unread" class="chat-unread-badge hidden">0</span>
  </button>

  <!-- Chat Drawer Modal -->
  <div id="chat-drawer" class="chat-drawer hidden">
    <div class="chat-header">
      <div class="chat-header-title">
        <span>💬</span>
        <span>Live Session Chat</span>
      </div>
      <div class="chat-header-actions">
        <button id="download-transcript-btn" class="chat-action-btn" title="Download Chat Transcript">
          <span>📥</span> Transcript
        </button>
        <button id="chat-close-btn" class="chat-close-btn" title="Close Chat">✕</button>
      </div>
    </div>

    <div id="chat-messages" class="chat-messages">
      <div class="chat-empty">
        <div class="chat-empty-icon">💬</div>
        <div>No messages yet</div>
        <div style="font-size:0.75rem; color:var(--text-muted);">Ask a question or say hi!</div>
      </div>
    </div>

    <form id="chat-form" class="chat-input-form">
      <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." maxlength="500" autocomplete="off">
      <button type="submit" class="chat-send-btn" title="Send message">➤</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/viewer.js"></script>
</body>
</html>
