apiVersion: apps/v1
kind: Deployment
metadata:
  name: webrtc-screen-share
  labels:
    app: webrtc-screen-share
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webrtc-screen-share
  template:
    metadata:
      labels:
        app: webrtc-screen-share
    spec:
      containers:
      - name: webrtc-screen-share
        image: asia-south1-docker.pkg.dev/adventureworks-dev/adventureworks-repo/webrtc-screen-share:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: webrtc-screen-share-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: webrtc-screen-share
